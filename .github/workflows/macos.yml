name: macOS

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: brew install cmake

      - name: Build SDL2 Classic
        run: |
          curl -fsSL --retry 3 \
            https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-2.32.10.tar.gz \
            -o "$RUNNER_TEMP/SDL2-2.32.10.tar.gz"
          echo "5f5993c530f084535c65a6879e9b26ad441169b3e25d789d83287040a9ca5165  $RUNNER_TEMP/SDL2-2.32.10.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/SDL2-2.32.10.tar.gz" -C "$RUNNER_TEMP"
          cmake -S "$RUNNER_TEMP/SDL2-2.32.10" -B "$RUNNER_TEMP/sdl2-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=26.0 \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sdl2-install" \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST=OFF
          cmake --build "$RUNNER_TEMP/sdl2-build" --parallel 3
          cmake --install "$RUNNER_TEMP/sdl2-build"

      - name: Configure Release
        run: >-
          cmake -S . -B build/mac-ci
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=26.0
          -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/sdl2-install"

      - name: Build
        run: cmake --build build/mac-ci --parallel 3

      - name: Run tests
        run: >-
          ctest --test-dir build/mac-ci --output-on-failure
          --output-junit "${{ github.workspace }}/build/mac-ci/test-results.xml"

      - name: Package application
        run: cmake --build build/mac-ci --target package

      - name: Verify extracted package
        run: >-
          python3 tools/verify_mac_package.py
          build/mac-ci/packages/*.tar.gz

      - name: Upload verified application
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: YipeIII-macOS-arm64
          path: build/mac-ci/packages/*.tar.gz
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macOS-test-results
          path: |
            build/mac-ci/test-results.xml
            build/mac-ci/Testing/Temporary/LastTest.log
          if-no-files-found: warn

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test-package
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified application
        run: gh run download "$RUN_ID" --name YipeIII-macOS-arm64 --dir dist

      - name: Publish preview release
        run: >-
          gh release create "$RELEASE_TAG" dist/*.tar.gz
          --verify-tag --prerelease
          --title "Yipe III $RELEASE_TAG"
          --notes-from-tag
